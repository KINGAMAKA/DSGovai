<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ZamAI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0f0c;color:#e9f2ed;display:flex;flex-direction:column;overflow:hidden;height:100vh}
header{padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #22302a;flex-shrink:0}
.logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#2ecc7a,#1fa463);display:grid;place-items:center;font-size:16px}
header h1{font-size:16px;font-weight:600}
.sp{flex:1}
#micToggle{width:34px;height:34px;border-radius:10px;border:1px solid #22302a;background:#111a16;color:#e9f2ed;font-size:14px;cursor:pointer}
#micToggle.on{border-color:#2ecc7a;color:#2ecc7a}
main{flex:1;overflow-y:auto;display:flex;flex-direction:column;min-height:0}
main.empty{justify-content:center;overflow:hidden}
#hero{display:none;flex-direction:column;align-items:center;text-align:center;padding:24px;gap:16px}
main.empty #hero{display:flex}
#hero h2{font-size:28px;font-weight:600;background:linear-gradient(120deg,#fff,#2ecc7a);-webkit-background-clip:text;background-clip:text;color:transparent}
#hero p{color:#8ea49a;font-size:13px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:380px;margin-top:6px}
.cards .card:last-child{grid-column:1/-1}
.card{background:#111a16;border:1px solid #22302a;border-radius:14px;padding:14px 12px;text-align:left;cursor:pointer;color:#e9f2ed;font-family:inherit;font-size:13px;font-weight:600;display:flex;flex-direction:column;gap:4px;transition:.15s}
.card:hover,.card:active{border-color:#2ecc7a;background:#16211c}
.card .ic{font-size:18px}
.card span{font-size:11px;color:#8ea49a;font-weight:400}
#chat{flex:1;display:flex;flex-direction:column;gap:12px;padding:16px;max-width:640px;width:100%;margin:0 auto}
.msg{display:flex;gap:8px;align-items:flex-start}
.msg.user{flex-direction:row-reverse}
.msg .av{width:26px;height:26px;border-radius:8px;background:#16211c;display:grid;place-items:center;font-size:12px;flex-shrink:0}
.msg.user .av{background:#2ecc7a}
.msg .b{padding:10px 13px;border-radius:13px;font-size:13.5px;line-height:1.55;max-width:82%;word-wrap:break-word;white-space:pre-wrap}
.msg.bot .b{background:#111a16;border:1px solid #22302a}
.msg.user .b{background:#1a3a28;border:1px solid rgba(46,204,122,.3)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-left:34px}
.chip{padding:6px 11px;border-radius:20px;border:1px solid #22302a;background:#16211c;color:#e9f2ed;font-size:12px;cursor:pointer;font-family:inherit;transition:.15s}
.chip:hover{border-color:#2ecc7a;color:#2ecc7a}
footer{padding:10px 14px 14px;border-top:1px solid #22302a;flex-shrink:0;background:#0a0f0c}
.ibar{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:6px;background:#111a16;border:1px solid #22302a;border-radius:24px;padding:4px 4px 4px 14px}
.ibar:focus-within{border-color:#2ecc7a}
#input{flex:1;background:transparent;border:0;outline:0;color:#e9f2ed;font-size:14px;font-family:inherit;padding:9px 0;min-width:0}
#mic,#send{width:40px;height:40px;border-radius:50%;border:0;cursor:pointer;flex-shrink:0;font-size:16px;display:grid;place-items:center}
#mic{background:linear-gradient(135deg,#2ecc7a,#1fa463);color:#04120a}
#mic.listening{background:linear-gradient(135deg,#ff6b57,#d9442f);color:#fff}
#send{background:#16211c;color:#2ecc7a;border:1px solid #22302a}
@media (max-width:400px){.cards{grid-template-columns:1fr}.cards .card:last-child{grid-column:auto}}
</style>
</head>
<body>

<header>
  <div class="logo">🇿🇲</div>
  <h1>ZamAI</h1>
  <div class="sp"></div>
  <button id="micToggle" class="on" title="Voice">🔊</button>
</header>

<main id="main" class="empty">
  <div id="hero">
    <h2>Talk to ZamAI</h2>
    <p>Your Zambian AI assistant</p>
    <div class="cards">
      <button class="card" data-p="name"><span class="ic">✨</span>Business Name<span>Get name ideas</span></button>
      <button class="card" data-p="plan"><span class="ic">📋</span>Business Plan<span>Build a simple plan</span></button>
      <button class="card" data-p="tips"><span class="ic">💡</span>Business Tips<span>Practical advice</span></button>
    </div>
  </div>
  <div id="chat"></div>
</main>

<footer>
  <div class="ibar">
    <input id="input" type="text" placeholder="Ask anything…" autocomplete="off">
    <button id="mic" title="Speak">🎙️</button>
    <button id="send" title="Send">➤</button>
  </div>
</footer>

<script>
(function(){
"use strict";

var main=document.getElementById("main");
var chat=document.getElementById("chat");
var input=document.getElementById("input");
var sendBtn=document.getElementById("send");
var micBtn=document.getElementById("mic");
var micToggle=document.getElementById("micToggle");

var voiceOn=true;
var busy=false;
var flow=null;
var step=0;
var data={};

var KNOWLEDGE=[
{k:["pacra","register","registration"],a:"PACRA handles business name registration and company registration in Zambia. Website: pacra.org.zm. Steps: name search, reserve, register."},
{k:["tpin","tax pin"],a:"TPIN is your Taxpayer Identification Number from ZRA. You need it to do business. Register at zra.org.zm."},
{k:["sole","partnership"],a:"Sole proprietorship = you alone, keep all profits, personally liable. Partnership = 2+ people share ownership and liability, needs a written agreement."},
{k:["business name vs company","name and company"],a:"A business name is simpler and cheaper for sole traders. A company is a separate legal entity (Ltd) with shareholders - more paperwork, limits liability."},
{k:["trading licence","licence","license","council"],a:"Every business in a council area needs a trading licence from the local authority. Food businesses also need a health certificate."},
{k:["napsa","pension","social security"],a:"NAPSA is the National Pension Scheme Authority. Register as employer as soon as you hire your first employee. napsa.co.zm."},
{k:["nhima","health insurance"],a:"NHIMA is the National Health Insurance Management Authority. Register yourself and employees, pay monthly, get covered at registered hospitals."},
{k:["zra","tax","taxes"],a:"ZRA collects taxes. You need a TPIN, must file returns even if you owe nothing. Pay turnover tax, VAT, or PAYE depending on size. zra.org.zm."},
{k:["turnover tax","tott"],a:"Turnover tax is a simplified tax for small businesses below a turnover threshold. It replaces income tax and VAT for those businesses. Check zra.org.zm."},
{k:["vat","value added"],a:"VAT applies once turnover crosses the registration threshold. Register with ZRA, charge VAT on sales, claim on purchases."},
{k:["cdf","constituency"],a:"CDF is the Constituency Development Fund - government funding for small businesses through your local council or MP's office."},
{k:["ceec","citizen economic"],a:"CEEC is the Citizens Economic Empowerment Commission. Offers loans and empowerment funds to Zambian-owned businesses. ceec.org.zm."},
{k:["bank account","open account"],a:"To open a business bank account: PACRA certificate, TPIN, ID, proof of address. Most banks require a minimum deposit."},
{k:["price","pricing"],a:"Price = cost + transport + overheads + margin (aim 30%+). Never price below cost. Test with a few customers first."},
{k:["records","bookkeeping"],a:"Keep a simple book: date, money in, money out, balance. Separate business money from personal money - this alone saves many small businesses."},
{k:["marketing","advertise"],a:"On a small budget: WhatsApp status, Facebook Marketplace, local notice boards, word of mouth. Ask happy customers for referrals."},
{k:["customers","find customers","get clients"],a:"Talk to 10 potential customers before launching. Find out where they shop and what's missing. First customers usually come from people you know."},
{k:["business plan","plan"],a:"A simple business plan has 7 parts: summary, goals, products, market, budget, compliance, funding. One page is fine for small business."},
{k:["how long register","cost register"],a:"Name search and reservation at PACRA is quick and cheap. Full registration takes days to weeks. Fees change - check pacra.org.zm."},
{k:["after registering","next step","what next"],a:"After PACRA: 1) TPIN from ZRA. 2) Trading licence from council. 3) Business bank account. 4) NAPSA if hiring."}
];

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

function enterChat(){if(main.className.indexOf("empty")!==-1){main.className="";main.id="main"}}

function scrollDown(){setTimeout(function(){try{main.scrollTop=main.scrollHeight}catch(e){}},30)}

function addUser(text){
enterChat();
var el=document.createElement("div");
el.className="msg user";
el.innerHTML='<div class="av">🧑</div><div class="b">'+esc(text)+'</div>';
chat.appendChild(el);
scrollDown();
}

function addBot(text,chips){
enterChat();
var el=document.createElement("div");
el.className="msg bot";
el.innerHTML='<div class="av">🤖</div><div class="b">'+esc(text)+'</div>';
chat.appendChild(el);
if(chips&&chips.length){
var row=document.createElement("div");
row.className="chips";
for(var i=0;i<chips.length;i++){
(function(lbl){
var b=document.createElement("button");
b.className="chip";
b.textContent=lbl;
b.onclick=function(){row.remove();send(lbl)};
row.appendChild(b);
})(chips[i]);
}
chat.appendChild(row);
}
scrollDown();
speak(text);
}

function botSay(text,chips,delay){
if(busy)return;
busy=true;
setTimeout(function(){
try{addBot(text,chips)}catch(e){}
busy=false;
},delay||500);
}

function speak(text){
if(!voiceOn)return;
if(!("speechSynthesis" in window))return;
try{
window.speechSynthesis.cancel();
var u=new SpeechSynthesisUtterance(String(text).replace(/[•·]/g,",").slice(0,220));
u.lang="en-ZM";
u.rate=1.03;
window.speechSynthesis.speak(u);
}catch(e){}
}

micToggle.onclick=function(){
voiceOn=!voiceOn;
if(voiceOn){micToggle.className="on";micToggle.textContent="🔊"}
else{micToggle.className="";micToggle.textContent="🔇";
if("speechSynthesis" in window){try{window.speechSynthesis.cancel()}catch(e){}}}
};

function findKnowledge(text){
var t=text.toLowerCase();
for(var i=0;i<KNOWLEDGE.length;i++){
var keys=KNOWLEDGE[i].k;
for(var j=0;j<keys.length;j++){
if(t.indexOf(keys[j])!==-1)return KNOWLEDGE[i].a;
}
}
return null;
}

var PREFIXES=["Zam","Kwacha","Ubuntu","Chalo","Mwana","Lusaka","Nkwazi","Tiyende","Sunzu","Kalulu","Bumi","Zambezi","Copperbelt","Kafue"];
var SECTORS={
agriculture:["Agri","Farm","Harvest","Greenfields","Munda"],
retail:["Mart","Trading","Stores","Market","Bazaar"],
tech:["Tech","Digital","Systems","Labs","Byte"],
tourism:["Safari","Travel","Lodge","Tours"],
food:["Kitchen","Foods","Bites","Grill","Cafe"],
transport:["Logistics","Trans","Movers","Cargo","Ride"],
other:["Ventures","Enterprises","Solutions","Holdings"]
};
var SOLE_SUF=["Trading","Enterprises","Services","Investments","Supplies"];
var PART_SUF=["& Partners","Associates","Holdings","Group","& Co"];

function genNames(type,sector){
var words=SECTORS[sector]||SECTORS.other;
var suf=type==="partnership"?PART_SUF:SOLE_SUF;
var out=[];
var seen={};
var guard=0;
while(out.length<5&&guard++<200){
var p=PREFIXES[Math.floor(Math.random()*PREFIXES.length)];
var w=words[Math.floor(Math.random()*words.length)];
var s=suf[Math.floor(Math.random()*suf.length)];
var r=Math.random();
var n;
if(r<0.5)n=p+" "+w+" "+s;
else if(r<0.8)n=w+" "+s;
else n=p+" "+w;
if(!seen[n]){seen[n]=true;out.push(n)}
}
return out;
}

function startName(){
flow="name";step=0;data={};
botSay("Let's create your business name.\n\nIs it for you alone (sole proprietor) or with partners (partnership)?",["Sole proprietor","Partnership"],400);
}

function nameFlow(text){
var t=text.toLowerCase();
if(step===0){
data.type=t.indexOf("partner")!==-1?"partnership":"sole";
step=1;
return botSay("Which sector?",["Agriculture","Retail","Tech","Food","Transport","Tourism","Other"],350);
}
if(step===1){
var sector="other";
var keys=Object.keys(SECTORS);
for(var i=0;i<keys.length;i++){
if(t.indexOf(keys[i])!==-1){sector=keys[i];break}
}
data.sector=sector;
var names=genNames(data.type,sector);
var list="";
for(var j=0;j<names.length;j++)list+=(j+1)+". "+names[j]+"\n";
flow=null;
return botSay("Here are 5 names:\n\n"+list+"\nCheck availability at PACRA before registering.",["Try again","Start over"],600);
}
}

function startPlan(){
flow="plan";step=0;data={};
botSay("Business plan time.\n\n1. What is the business called?",null,350);
}

function planFlow(text){
if(step===0){
data.name=text.trim()||"Your Business";
step=1;
return botSay("2. Which sector?",["Agriculture","Retail","Tech","Food","Transport","Tourism","Other"],350);
}
if(step===1){
var t=text.toLowerCase();
var sector="other";
var keys=Object.keys(SECTORS);
for(var i=0;i<keys.length;i++){
if(t.indexOf(keys[i])!==-1){sector=keys[i];break}
}
data.sector=sector;
step=2;
return botSay("3. Starting budget in Kwacha? (e.g. 50000)",null,350);
}
if(step===2){
var m=text.match(/[\d,]+/);
var num=m?parseInt(m[0].replace(/,/g,""),10):0;
data.budget=num||0;
step=3;
return botSay("4. Where will you operate? (e.g. Lusaka)",null,350);
}
if(step===3){
data.location=text.trim()||"Zambia";
return finishPlan();
}
}

function fmtK(n){return "K"+(n||0).toLocaleString()}

function finishPlan(){
var d=data;
var b=d.budget||0;
var txt="Business Plan - "+d.name+"\n"+
"Location: "+d.location+" | Sector: "+d.sector+" | Budget: "+fmtK(b)+"\n\n"+
"1. Summary\n"+d.name+" is a "+d.sector+" business in "+d.location+" starting with "+fmtK(b)+".\n\n"+
"2. Budget split\n"+
"Operations: "+fmtK(Math.round(b*0.4))+"\n"+
"Marketing: "+fmtK(Math.round(b*0.25))+"\n"+
"Equipment: "+fmtK(Math.round(b*0.2))+"\n"+
"Reserve: "+fmtK(Math.round(b*0.15))+"\n\n"+
"3. Compliance\n"+
"PACRA - register name\n"+
"ZRA - get TPIN\n"+
"Council - trading licence\n"+
"NAPSA/NHIMA - if hiring\n\n"+
"Want tips for this sector?";
flow=null;
botSay(txt,["Business tips","Start over"],700);
}

function startTips(){
flow="tips";step=0;data={};
botSay("What sector is your business in?",["Agriculture","Retail","Tech","Food","Transport","Tourism","Other"],350);
}

function tipsFlow(text){
var t=text.toLowerCase();
var sector="other";
var keys=Object.keys(SECTORS);
for(var i=0;i<keys.length;i++){
if(t.indexOf(keys[i])!==-1){sector=keys[i];break}
}
var tips={
agriculture:["Test your soil before buying fertilizer.","Join a cooperative for better market prices.","Keep records of every bag in and every kg out.","Plan around the rainy season - irrigation pays for itself.","Check FISP and CEEC for support."],
retail:["Start with fast-moving stock only.","Price = cost + transport + 30% minimum.","Accept mobile money - most customers prefer it.","Track stock daily; theft and dead stock kill shops.","Build regulars - loyal customers return."],
tech:["Solve one real problem well.","Charge from day one, even a small amount.","Start with a WhatsApp group as v1.","Document everything.","Register the name and buy a domain early."],
food:["Cost every plate - most food businesses fail on hidden costs.","Perfect 5 dishes first; consistency beats variety.","Get a health certificate from your council.","Location matters more than decor.","Post food photos on social media - they sell themselves."],
transport:["Maintain vehicles before they break.","Know your true cost per km.","Get goods-in-transit insurance.","Keep a logbook of every trip.","Build a base of regular clients."],
tourism:["Partner with lodges for referrals.","List on Google Maps and TripAdvisor.","Save in high season for low season.","Train guides on storytelling, not just facts.","Get licensed by Zambia Tourism Agency."],
other:["Know your numbers every week.","Separate business money from personal money.","Start small, prove the model, then grow.","Register with PACRA and get a TPIN.","Ask customers what to fix - they will tell you."]
};
var arr=tips[sector]||tips.other;
var txt="5 tips for "+sector+":\n\n";
for(var i=0;i<arr.length;i++)txt+=(i+1)+". "+arr[i]+"\n";
flow=null;
botSay(txt,["Business plan","Business name","Start over"],600);
}

function handle(text){
var t=text.toLowerCase().trim();

if(flow==="name")return nameFlow(text);
if(flow==="plan")return planFlow(text);
if(flow==="tips")return tipsFlow(text);

if(t==="start over"||t==="reset"||t==="restart"){
flow=null;step=0;data={};
return botSay("Fresh start. What would you like to do?",["Business name","Business plan","Business tips"],350);
}
if(t==="try again"||t.indexOf("try again")!==-1)return startName();

if(t.indexOf("business name")!==-1||t==="name")return startName();
if(t.indexOf("business plan")!==-1||t==="plan")return startPlan();
if(t.indexOf("tip")!==-1)return startTips();

var k=findKnowledge(text);
if(k)return botSay(k,["Business name","Business plan","Business tips"],450);

if(/^(hi|hello|hey|muli bwanji|good morning|good afternoon|good evening)/.test(t)){
return botSay("Muli bwanji! I'm ZamAI.\n\nI can help you with a business name, a business plan, or tips. Or ask me anything about PACRA, ZRA, NAPSA, NHIMA and more.",["Business name","Business plan","Business tips"],350);
}

botSay("I didn't quite catch that. Try:\n\n\"business name\" - get name ideas\n\"business plan\" - build a plan\n\"tips\" - sector advice\nOr ask about PACRA, TPIN, NAPSA, taxes.",["Business name","Business plan","Business tips","What is PACRA?"],450);
}

function send(text){
var v;
if(typeof text==="string")v=text.trim();
else v=input.value.trim();
if(!v||busy)return;
input.value="";
addUser(v);
handle(v);
}

sendBtn.onclick=function(){send()};

input.addEventListener("keydown",function(e){
if(e.key==="Enter"){e.preventDefault();send()}
});

var cards=document.querySelectorAll(".card");
for(var c=0;c<cards.length;c++){
(function(btn){
btn.onclick=function(){
var p=btn.getAttribute("data-p");
var label=btn.textContent.replace(/[\n\r]/g," ").replace(/\s+/g," ").trim();
addUser(label);
if(p==="name")startName();
else if(p==="plan")startPlan();
else if(p==="tips")startTips();
};
})(cards[c]);
}

var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
var recog=null;
var listening=false;

if(!SR){
micBtn.style.opacity="0.4";
micBtn.title="Voice not supported - try Chrome on Android";
}else{
recog=new SR();
recog.lang="en-ZM";
recog.interimResults=false;
recog.maxAlternatives=1;
recog.onstart=function(){listening=true;micBtn.className="listening";micBtn.textContent="⏹"};
recog.onend=function(){listening=false;micBtn.className="";micBtn.textContent="🎙️"};
recog.onerror=function(){listening=false;micBtn.className="";micBtn.textContent="🎙️"};
recog.onresult=function(e){
var t=e.results[0][0].transcript;
input.value=t;
setTimeout(function(){send()},250);
};
micBtn.onclick=function(){
if(listening){try{recog.stop()}catch(err){}return}
if("speechSynthesis" in window){try{window.speechSynthesis.cancel()}catch(e){}}
try{recog.start()}catch(err){}
};
}

})();
</script>
</body>
</html>
